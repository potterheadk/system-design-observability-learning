global:
  scrape_interval: 5s # Aggressive scraping for homelab/learning (default is usually 1m)

scrape_configs:
  - job_name: 'service-a'
    static_configs:
      - targets: ['service-a:8000']

  - job_name: 'service-b'
    static_configs:
      - targets: ['service-b:8000']
    
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
