apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: my-worker:v1
        imagePullPolicy: Never
        env:
        - name: REDIS_HOST
          value: "redis"
        resources:
          requests:
            memory: "100Mi"
            cpu: "100m"