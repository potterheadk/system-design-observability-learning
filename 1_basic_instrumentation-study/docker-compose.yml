version: '3.8'

services:
  service-a:
    build: ./service_a
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - 8001:8000
    environment:
      - SERVICE_B_URL=http://service-b:8000
    depends_on:
      - service-b

  service-b:
    build: ./service_b
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - 8002:8000

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./platform/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  observability-api:
    build: ./observability-api
    ports:
      - "8080:8000"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
    depends_on:
      - prometheus

  ai-agent:
    build: ./ai-agent
    ports:
      - "8090:8000"
    environment:
      - OBSERVABILITY_API_URL=http://observability-api:8000/graphql
      - LLM_PROVIDER=gemini  # Change to 'ollama' later
      - GEMINI_API_KEY=${GEMINI_API_KEY} # We will set this in .env
    depends_on:
      - observability-api