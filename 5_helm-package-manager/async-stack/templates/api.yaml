apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # Variable: Read 'replicaCount' from values.yaml
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        # Variable: Read image name and tag
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: Never
        env:
        - name: REDIS_HOST
          value: "redis"
        resources:
          requests:
            memory: "100Mi"
            cpu: "100m"
        ports:
        - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: ClusterIP # We use Ingress now, so ClusterIP (Internal only) is fine
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000